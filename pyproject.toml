[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sworker"
version = "0.1.0"
description = "Sovereign AI Worker Platform — a local-first AI employee for businesses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sworker = "sworker.cli:main"

[tool.setuptools]
packages = ["sworker", "sworker.tools"]
